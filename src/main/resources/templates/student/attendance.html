<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="theme-student">
    <header>
        <div class="container header-content">
            <a th:href="@{/student/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user.fullName}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/student/dashboard}">Dashboard</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Mark Attendance</h1>
            <p style="color: var(--text-light); font-size: 0.9rem;">Enter the code to mark your attendance</p>
        </div>
        
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <div class="card-header">
                <h3>Enter Attendance Code</h3>
            </div>
            <div class="card-body">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                
                <form th:action="@{/student/attendance/mark}" method="post">
                    <div class="form-group">
                        <label for="code">4-Digit Code</label>
                        <input type="text" id="code" name="code" class="form-control" 
                               pattern="[A-Za-z0-9]{4}" maxlength="4" required 
                               placeholder="Enter the code displayed by your teacher">
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Mark Attendance</button>
                </form>
                
                <p style="margin-top: 1.5rem; color: var(--text-light); text-align: center; font-size: 0.85rem;">
                    Enter the 4-digit code displayed on your teacher's screen to mark your attendance.
                </p>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
