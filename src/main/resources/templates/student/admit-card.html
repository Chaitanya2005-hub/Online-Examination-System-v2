<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admit Card</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="theme-student">
    <header>
        <div class="container header-content">
            <a th:href="@{/student/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="'Welcome, ' + ${user.fullName}"></span>
                <a th:href="@{/student/dashboard}">Dashboard</a>
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <h1 style="margin-bottom: 2rem;">Admit Card</h1>
        
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div class="card-header">
                <h3>Admit Card Status</h3>
            </div>
            <div class="card-body">
                <div th:if="${admitCard != null}">
                    <p><strong>Status:</strong> 
                        <span th:if="${admitCard.status == T(com.stark.studentmanagement.entity.AdmitCard.AdmitCardStatus).RELEASED}" 
                              style="color: var(--success-color); font-weight: 600;">Released</span>
                        <span th:if="${admitCard.status == T(com.stark.studentmanagement.entity.AdmitCard.AdmitCardStatus).BLOCKED}" 
                              style="color: var(--danger-color); font-weight: 600;">Blocked</span>
                    </p>
                    
                    <div th:if="${admitCard.status == T(com.stark.studentmanagement.entity.AdmitCard.AdmitCardStatus).RELEASED}" 
                         style="margin-top: 1.5rem;">
                        <a th:href="@{/student/admit-card/download}" class="btn btn-primary" style="width: 100%;">
                            Download Admit Card (PDF)
                        </a>
                    </div>
                    
                    <div th:if="${admitCard.status == T(com.stark.studentmanagement.entity.AdmitCard.AdmitCardStatus).BLOCKED}" 
                         style="margin-top: 1.5rem;">
                        <p style="color: var(--text-light);">Your admit card is currently blocked. Please contact the administration.</p>
                    </div>
                </div>
                
                <div th:if="${admitCard == null}">
                    <p style="color: var(--text-light);">Admit card information not available.</p>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
