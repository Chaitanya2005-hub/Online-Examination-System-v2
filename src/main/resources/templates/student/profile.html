<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="theme-student">
    <header>
        <div class="container header-content">
            <a th:href="@{/student/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user.fullName}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/student/dashboard}">Dashboard</a>
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Edit Profile</h1>
            <p style="color: var(--text-light); font-size: 0.9rem;">Update your profile information</p>
        </div>
        
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div class="card-header">
                <h3>Profile Information</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/student/profile}" method="post" th:object="${user}">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" th:field="*{username}" class="form-control" required readonly>
                        <small style="color: var(--text-light); font-size: 0.8rem;">Username cannot be changed</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" th:field="*{department}" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="number" id="year" th:field="*{year}" class="form-control" min="1" max="5">
                    </div>
                    
                    <div class="form-group">
                        <label for="section">Section</label>
                        <input type="text" id="section" th:field="*{section}" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="erpId">ERP ID</label>
                        <input type="text" id="erpId" th:field="*{erpId}" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="photoPath">Photo URL</label>
                        <input type="url" id="photoPath" th:field="*{photoPath}" class="form-control" placeholder="https://example.com/photo.jpg">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                    <a th:href="@{/student/dashboard}" class="btn btn-outline" style="margin-left: 0.5rem;">Cancel</a>
                </form>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
