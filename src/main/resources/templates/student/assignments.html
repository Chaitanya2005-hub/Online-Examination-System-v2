<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="theme-student">
    <header>
        <div class="container header-content">
            <a th:href="@{/student/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="'Welcome, ' + ${user.fullName}"></span>
                <a th:href="@{/student/dashboard}">Dashboard</a>
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <h1 style="margin-bottom: 2rem;">Assignments</h1>
        
        <div th:if="${success}" style="background-color: #d1e7dd; color: #0f5132; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #badbcc;">
            <strong th:text="${success}"></strong>
        </div>

        <div th:if="${assignments != null and !assignments.empty}">
            <div class="card" th:each="assignment : ${assignments}" style="margin-bottom: 1.5rem;">
                <div class="card-header">
                    <h3 th:text="${assignment.title}">Assignment Title</h3>
                </div>
                <div class="card-body">
                    <p th:text="${assignment.description}">Assignment description</p>
                    <p style="margin-bottom: 1rem;"><strong>Due Date:</strong> <span th:text="${assignment.dueDate}"></span></p>
                    
                    <form th:action="@{/student/assignments/submit}" method="post" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                        <input type="hidden" name="assignmentId" th:value="${assignment.id}" />
                        <div class="form-group" style="margin-bottom: 0.75rem;">
                            <label style="font-size: 0.85rem; font-weight: 600;">Your Submission / Code / Solution Notes:</label>
                            <textarea name="submissionText" class="form-control" rows="3" placeholder="Type or paste your assignment solution notes / repository links here..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="padding: 0.5rem 1.25rem;">📤 Submit Solution</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div th:if="${assignments == null or assignments.empty}">
            <div class="card">
                <div class="card-body">
                    <p style="text-align: center; color: var(--text-light);">No assignments available at the moment.</p>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
