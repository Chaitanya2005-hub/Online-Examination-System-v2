<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Exams</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="theme-student">
    <header>
        <div class="container header-content">
            <a th:href="@{/student/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user.fullName}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/student/dashboard}">Dashboard</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Available Exams</h1>
            <p style="color: var(--text-light); font-size: 0.9rem;">View and take scheduled examinations</p>
        </div>
        
        <div th:if="${exams != null and !exams.empty}">
            <div class="card" th:each="exam : ${exams}">
                <div class="card-header">
                    <h3 th:text="${exam.title}">Exam Title</h3>
                </div>
                <div class="card-body">
                    <p style="margin-bottom: 0.5rem;"><strong>Date:</strong> <span th:text="${exam.examDate}"></span></p>
                    <p style="margin-bottom: 0.5rem;"><strong>Time:</strong> <span th:text="${exam.startTime}"></span></p>
                    <p style="margin-bottom: 0.5rem;"><strong>Duration:</strong> <span th:text="${exam.durationMinutes + ' minutes'}"></span></p>
                    <p style="margin-bottom: 1rem;"><strong>Status:</strong> <span th:text="${exam.status}"></span></p>
                    <a th:href="@{/student/exam/{id}(id=${exam.id})}" class="btn btn-primary">Take Exam</a>
                </div>
            </div>
        </div>
        
        <div th:if="${exams == null or exams.empty}">
            <div class="card">
                <div class="card-body">
                    <p style="text-align: center; color: var(--text-light); font-size: 0.9rem;">No exams available at the moment.</p>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
