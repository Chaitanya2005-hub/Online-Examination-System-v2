<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Error Page</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script th:src="@{/js/theme-toggle.js}"></script>
    <style>
        .error-card {
            max-width: 550px;
            margin: 4rem auto;
            text-align: center;
            padding: 2.5rem 2rem;
            background: var(--card-bg, #ffffff);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color, #e2e8f0);
        }
        .error-code {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ef4444;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-dark, #1e293b);
        }
        .error-desc {
            color: var(--text-light, #64748b);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            word-break: break-word;
            background: rgba(239, 68, 68, 0.05);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border-left: 3px solid #ef4444;
        }
        .action-btns {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body class="theme-student">
    <header>
        <div class="container header-content">
            <a th:href="@{/}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
            </nav>
        </div>
    </header>
    
    <main class="container">
        <div class="error-card">
            <div class="error-code" th:text="${statusCode != null ? statusCode : '500'}">500</div>
            <div class="error-title">Oops! Something went wrong</div>
            <div class="error-desc" th:text="${errorMessage != null ? errorMessage : 'An unexpected internal server error occurred.'}">
                An unexpected internal server error occurred.
            </div>
            
            <p style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 1rem;">
                If this issue persists, please contact the administrator or try refreshing the page.
            </p>

            <div class="action-btns">
                <button onclick="window.history.back()" class="btn btn-outline">⬅️ Go Back</button>
                <a th:href="@{/}" class="btn btn-primary">🏠 Return to Dashboard</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
