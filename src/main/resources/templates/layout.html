<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body th:classappend="${theme}">
    <header>
        <div class="container header-content">
            <a th:href="@{/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user != null ? user.fullName : 'Guest'}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/dashboard}">Dashboard</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
        <div th:replace="${content}"></div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
