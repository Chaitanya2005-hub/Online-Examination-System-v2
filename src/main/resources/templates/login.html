<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body>
    <div style="position: absolute; top: 1rem; right: 1rem; z-index: 10;">
        <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
            🌙
        </button>
    </div>
    <div class="login-container">
        <div class="login-card">
            <h2>Student Management System</h2>
            <p style="text-align: center; color: var(--text-light); margin-bottom: 2rem; font-size: 0.9rem;">Sign in to your account</p>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="Enter your username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password" style="padding-right: 2.5rem;">
                        <button type="button" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 0.5rem; background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0.25rem;" title="Toggle password visibility">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>
            
            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-light); font-size: 0.85rem;">
                Don't have an account? <a th:href="@{/register}" style="color: var(--primary-color); text-decoration: none;">Register here</a>
            </p>
        </div>
    </div>
    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = '🙈';
            } else {
                input.type = 'password';
                btn.innerText = '👁️';
            }
        }
    </script>
</body>
</html>
