<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .role-specific {
            display: none;
        }
        .role-specific.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Create Account</h2>
            <p style="text-align: center; color: var(--text-light); margin-bottom: 2rem; font-size: 0.9rem;">Fill in your details to register</p>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            
            <form th:action="@{/register}" method="post" th:object="${user}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" required placeholder="Choose a username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required placeholder="Choose a password">
                </div>
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" th:field="*{role}" class="form-control" required onchange="toggleRoleFields()">
                        <option value="">Select Role</option>
                        <option value="STUDENT">Student</option>
                        <option value="TEACHER">Teacher</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                
                <!-- Student-specific fields -->
                <div id="studentFields" class="role-specific">
                    <div class="form-group">
                        <label for="erpId">ERP ID</label>
                        <input type="text" id="erpId" th:field="*{erpId}" class="form-control" placeholder="Enter ERP ID">
                    </div>
                    
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="Enter department (e.g., CSE, ECE, ME)">
                    </div>
                    
                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="number" id="year" th:field="*{year}" class="form-control" min="1" max="4" placeholder="Enter year (1-4)">
                    </div>
                    
                    <div class="form-group">
                        <label for="section">Section</label>
                        <input type="text" id="section" th:field="*{section}" class="form-control" placeholder="Enter section (e.g., A, B, C)">
                    </div>
                </div>
                
                <!-- Teacher-specific fields -->
                <div id="teacherFields" class="role-specific">
                    <div class="form-group">
                        <label for="erpId">Employee ID</label>
                        <input type="text" id="erpId" th:field="*{erpId}" class="form-control" placeholder="Enter Employee ID">
                    </div>
                    
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="Enter department (e.g., CSE, ECE, ME)">
                    </div>
                </div>
                
                <!-- Admin-specific fields -->
                <div id="adminFields" class="role-specific">
                    <p style="color: var(--text-light); font-size: 0.85rem; margin-bottom: 1rem;">Admin account created with basic information only.</p>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
            </form>
            
            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-light); font-size: 0.85rem;">
                Already have an account? <a th:href="@{/login}" style="color: var(--primary-color); text-decoration: none;">Login here</a>
            </p>
        </div>
    </div>
    
    <script>
        function toggleRoleFields() {
            const role = document.getElementById('role').value;
            const studentFields = document.getElementById('studentFields');
            const teacherFields = document.getElementById('teacherFields');
            const adminFields = document.getElementById('adminFields');
            
            // Hide all role-specific fields
            studentFields.classList.remove('visible');
            teacherFields.classList.remove('visible');
            adminFields.classList.remove('visible');
            
            // Show relevant fields based on role
            if (role === 'STUDENT') {
                studentFields.classList.add('visible');
            } else if (role === 'TEACHER') {
                teacherFields.classList.add('visible');
            } else if (role === 'ADMIN') {
                adminFields.classList.add('visible');
            }
        }
    </script>
</body>
</html>
