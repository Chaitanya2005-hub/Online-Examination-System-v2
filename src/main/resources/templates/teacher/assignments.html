<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Assignments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="theme-teacher">
    <header>
        <div class="container header-content">
            <a th:href="@{/teacher/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user.fullName}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/teacher/dashboard}">Dashboard</a>
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Manage Assignments</h1>
            <p style="color: var(--text-light); font-size: 0.9rem;">Create assignments and review student submissions</p>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}" style="margin-bottom: 1rem;"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}" style="margin-bottom: 1rem;"></div>
        
        <div class="card">
            <div class="card-header">
                <h3>Create Assignment</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/teacher/assignments}" method="post" th:object="${assignment}">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="dueDate">Due Date</label>
                        <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Assignment</button>
                </form>
            </div>
        </div>
        
        <div class="card" style="margin-top: 2rem;">
            <div class="card-header">
                <h3>Your Assignments</h3>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Due Date</th>
                            <th>Submissions</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="assignment : ${assignments}">
                            <td th:text="${assignment.title}"></td>
                            <td th:text="${assignment.description}"></td>
                            <td th:text="${assignment.dueDate}"></td>
                            <td>
                                <span class="badge" style="background: var(--primary-color, #2563eb); color: #fff; padding: 0.25rem 0.6rem; border-radius: 999px; font-size: 0.8rem;"
                                      th:text="${submissionCounts != null ? submissionCounts[assignment.id] : 0} + ' submitted'">0 submitted</span>
                            </td>
                            <td style="white-space: nowrap;">
                                <a th:href="@{/teacher/assignments/{id}/submissions(id=${assignment.id})}" class="btn btn-primary" style="padding: 0.35rem 0.75rem; font-size: 0.85rem;">View Submissions</a>
                                <form th:action="@{/teacher/assignments/delete/{id}(id=${assignment.id})}" method="post" style="display: inline; margin-left: 0.4rem;" onsubmit="return confirm('Delete this assignment and all its submissions?');">
                                    <button type="submit" class="btn btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; color: #dc2626; border-color: #dc2626;">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
