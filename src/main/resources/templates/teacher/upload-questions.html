<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Questions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="theme-teacher">
    <header>
        <div class="container header-content">
            <a th:href="@{/teacher/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user.fullName}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/teacher/dashboard}">Dashboard</a>
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Upload Questions</h1>
            <p style="color: var(--text-light); font-size: 0.9rem;">Add questions to question bank</p>
        </div>
        
        <!-- Success / Error Alert Messages -->
        <div th:if="${success}" style="background-color: #d1e7dd; color: #0f5132; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #badbcc;">
            <strong th:text="${success}"></strong>
        </div>
        <div th:if="${error}" style="background-color: #f8d7da; color: #842029; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #f5c2c7;">
            <strong th:text="${error}"></strong>
        </div>

        <!-- AI Question Generator Card -->
        <div class="card" style="max-width: 800px; margin: 0 auto 2rem auto; border: 2px solid #6366f1; background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(168, 85, 247, 0.05) 100%);">
            <div class="card-header" style="background: linear-gradient(90deg, #4f46e5, #7c3aed); color: white;">
                <h3 style="display: flex; align-items: center; gap: 0.5rem; color: white;">
                    ✨ Auto-Generate Questions with Google Gemini AI
                </h3>
            </div>
            <div class="card-body">
                <form th:action="@{/teacher/auto-generate-questions}" method="post">
                    <div class="form-group">
                        <label for="aiExam">Select Exam</label>
                        <select id="aiExam" name="examId" class="form-control" required>
                            <option value="">-- Select Exam --</option>
                            <option th:each="exam : ${exams}" th:value="${exam.id}" th:text="${exam.title}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="count">Number of Questions to Generate</label>
                        <input type="number" id="count" name="count" class="form-control" value="10" min="1" max="25" required>
                    </div>

                    <div class="form-group">
                        <label for="difficultyLevel">Difficulty Level</label>
                        <select id="difficultyLevel" name="difficultyLevel" class="form-control" required>
                            <option value="EASY">🟢 Easy (Conceptual & Definitions)</option>
                            <option value="MEDIUM" selected>🟡 Medium (Standard Exam Level)</option>
                            <option value="HARD">🔴 Hard (Advanced Analytical & Problem Solving)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="topicFocus">Topic / Focus Area (Optional)</label>
                        <input type="text" id="topicFocus" name="topicFocus" class="form-control" placeholder="e.g. Automata & Grammars, Dynamic Programming, Spring MVC Controllers">
                    </div>

                    <div class="form-group">
                        <label for="geminiApiKey">Google Gemini API Key (Optional)</label>
                        <input type="password" id="geminiApiKey" name="apiKey" class="form-control" placeholder="AIzaSy... (Paste key or leave blank to use system key)">
                        <small style="color: var(--text-light); font-size: 0.8rem; display: block; margin-top: 0.25rem;">
                            Need a free key? Get one instantly at <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: #4f46e5; font-weight: 600;">Google AI Studio 🔑</a>
                        </small>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; background: linear-gradient(90deg, #4f46e5, #7c3aed); border: none; font-weight: 600;">
                        🤖 Generate & Save Questions to Database
                    </button>
                </form>
            </div>
        </div>

        <!-- Manual Add Question Form -->
        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header">
                <h3>Add New Question Manually</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/teacher/upload-questions}" method="post" th:object="${question}">
                    <div class="form-group">
                        <label for="exam">Select Exam</label>
                        <select id="exam" th:field="*{exam}" class="form-control" required>
                            <option value="">Select Exam</option>
                            <option th:each="exam : ${exams}" th:value="${exam.id}" th:text="${exam.title}"></option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="questionText">Question</label>
                        <textarea id="questionText" th:field="*{questionText}" class="form-control" rows="3" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="optionA">Option A</label>
                        <input type="text" id="optionA" th:field="*{optionA}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="optionB">Option B</label>
                        <input type="text" id="optionB" th:field="*{optionB}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="optionC">Option C</label>
                        <input type="text" id="optionC" th:field="*{optionC}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="optionD">Option D</label>
                        <input type="text" id="optionD" th:field="*{optionD}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="correctAnswer">Correct Answer</label>
                        <select id="correctAnswer" th:field="*{correctAnswer}" class="form-control" required>
                            <option value="">Select Correct Answer</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Add Question</button>
                </form>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
