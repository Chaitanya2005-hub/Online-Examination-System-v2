<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Notice</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="theme-admin">
    <header>
        <div class="container header-content">
            <a th:href="@{/admin/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user.fullName}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <a th:href="@{/admin/manage-users}">Users</a>
                <a th:href="@{/admin/schedule-exam}">Exams</a>
                <a th:href="@{/admin/post-notice}">Notices</a>
                <a th:href="@{/admin/manage-admit-cards}">Admit Cards</a>
                <a th:href="@{/admin/admin-fees}">Fees</a>
                <a th:href="@{/admin/grievances}">Grievances</a>
                <a th:href="@{/admin/manage-subjects}">Subjects</a>
                <a th:href="@{/admin/live-monitoring}">Live Monitoring</a>
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Post Notice</h1>
            <p style="color: var(--text-light); font-size: 0.9rem;">Announce to all users</p>
        </div>
        
        <div class="card" style="max-width: 600px;">
            <div class="card-header">
                <h3>New Notice</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/post-notice}" method="post" th:object="${notice}">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" th:field="*{message}" class="form-control" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Post Notice</button>
                </form>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
