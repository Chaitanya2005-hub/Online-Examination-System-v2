<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Questions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="theme-teacher">
    <header>
        <div class="container header-content">
            <a th:href="@{/teacher/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user.fullName}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/teacher/dashboard}">Dashboard</a>
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Upload Questions</h1>
            <p style="color: var(--text-light); font-size: 0.9rem;">Add questions to question bank</p>
        </div>
        
        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header">
                <h3>Add New Question</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/teacher/upload-questions}" method="post" th:object="${question}">
                    <div class="form-group">
                        <label for="exam">Select Exam</label>
                        <select id="exam" th:field="*{exam}" class="form-control" required>
                            <option value="">Select Exam</option>
                            <option th:each="exam : ${exams}" th:value="${exam.id}" th:text="${exam.title}"></option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="questionText">Question</label>
                        <textarea id="questionText" th:field="*{questionText}" class="form-control" rows="3" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="optionA">Option A</label>
                        <input type="text" id="optionA" th:field="*{optionA}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="optionB">Option B</label>
                        <input type="text" id="optionB" th:field="*{optionB}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="optionC">Option C</label>
                        <input type="text" id="optionC" th:field="*{optionC}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="optionD">Option D</label>
                        <input type="text" id="optionD" th:field="*{optionD}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="correctAnswer">Correct Answer</label>
                        <select id="correctAnswer" th:field="*{correctAnswer}" class="form-control" required>
                            <option value="">Select Correct Answer</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Add Question</button>
                </form>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
