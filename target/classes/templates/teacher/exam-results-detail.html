<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="theme-teacher">
    <header>
        <div class="container header-content">
            <a th:href="@{/teacher/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user.fullName}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/teacher/dashboard}">Dashboard</a>
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Exam Results Detail</h1>
            <p style="color: var(--text-light); font-size: 0.9rem;">Detailed student performance</p>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Student Results</h3>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Score</th>
                            <th>Total Marks</th>
                            <th>Percentage</th>
                            <th>Status</th>
                            <th>Security Warnings</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="result : ${results}">
                            <td th:text="${result.student?.fullName}"></td>
                            <td th:text="${result.score}"></td>
                            <td th:text="${result.totalMarks}"></td>
                            <td th:text="${(result.score * 100 / result.totalMarks) + '%'}"></td>
                            <td th:text="${result.status}"></td>
                            <td th:text="${result.securityWarnings}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
