<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="theme-teacher">
    <header>
        <div class="container header-content">
            <a th:href="@{/teacher/dashboard}" class="logo">Student Management System</a>
            <nav class="nav-links">
                <span th:text="${user.fullName}" style="font-weight: 500; color: var(--text-dark);"></span>
                <a th:href="@{/teacher/dashboard}">Dashboard</a>
                <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none; background: none; cursor: pointer;" onclick="toggleTheme()">
                    🌙
                </button>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding-top: 2rem;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;">Manage Exams</h1>
            <p style="color: var(--text-light); font-size: 0.9rem;">Create and manage exams</p>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Create New Exam</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/teacher/manage-exams}" method="post" th:object="${exam}">
                    <div class="form-group">
                        <label for="title">Exam Title</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" th:field="*{subject}" class="form-control" required>
                            <option value="">Select Subject</option>
                            <option th:each="subject : ${subjects}" th:value="${subject.id}" th:text="${subject.name}"></option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="examDate">Exam Date</label>
                        <input type="date" id="examDate" th:field="*{examDate}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="startTime">Start Time</label>
                        <input type="time" id="startTime" th:field="*{startTime}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="durationMinutes">Duration (minutes)</label>
                        <input type="number" id="durationMinutes" th:field="*{durationMinutes}" class="form-control" min="1" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" th:field="*{status}" class="form-control" required>
                            <option value="SCHEDULED">Scheduled</option>
                            <option value="ONGOING">Ongoing</option>
                            <option value="COMPLETED">Completed</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Create Exam</button>
                </form>
            </div>
        </div>
        
        <div class="card" style="margin-top: 2rem;">
            <div class="card-header">
                <h3>All Exams</h3>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Subject</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="exam : ${exams}">
                            <td th:text="${exam.title}"></td>
                            <td th:text="${exam.subject != null ? exam.subject.name : 'N/A'}"></td>
                            <td th:text="${exam.examDate}"></td>
                            <td th:text="${exam.startTime}"></td>
                            <td th:text="${exam.durationMinutes + ' min'}"></td>
                            <td>
                                <span class="badge" 
                                      th:class="'badge ' + ${exam.status == 'SCHEDULED' ? 'badge-info' : exam.status == 'ONGOING' ? 'badge-warning' : 'badge-success'}"
                                      th:text="${exam.status}"></span>
                            </td>
                            <td>
                                <a th:href="@{/teacher/manage-exams/edit/{id}(id=${exam.id})}" class="btn btn-sm btn-primary">Edit</a>
                                <a th:href="@{/teacher/manage-exams/delete/{id}(id=${exam.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this exam? This will also delete all associated questions.');">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Student Management System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
